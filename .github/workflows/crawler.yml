name: Daily Political Crawler

on:
  schedule:
    # Runs at 00:00 UTC every day (approx 5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow from GitHub UI

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Backend Dependencies
      working-directory: ./server
      run: npm install

    - name: Run Crawler Script
      working-directory: ./server
      # Replace 'autonomous_tracker.js' with your exact crawler script name if different
      run: node scripts/autonomous_tracker.js
      env:
        # Add your secrets here
        # You must add these exact secrets in your GitHub Repository Settings -> Secrets and variables -> Actions
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
